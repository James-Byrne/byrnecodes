<footer class="container-site flex flex-wrap justify-between gap-4 py-6 text-sm text-muted md:py-7">
  <span>© {{ 'now' | date: '%Y' }} Byrnecodes</span>
  <span class="flex items-center gap-2 font-mono">
    <a href="https://github.com/{{ site.social.github }}" class="footer-link">GitHub</a>
    {%- if site.social.linkedin and site.social.linkedin != "" -%}
      <span aria-hidden="true">·</span><a href="{{ site.social.linkedin }}" class="footer-link">LinkedIn</a>
    {%- endif %}
  </span>
</footer>
