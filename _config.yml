title: Byrnecodes
tagline: James Byrne — full-stack developer
description: "James Byrne, full-stack developer: Ember & Rails web apps, iPhone & Apple Watch apps, and payment systems."
url: https://byrnecodes.com
author: James Byrne
email: james@byrnecodes.com
availability: ""
social:
  github: james-byrne
  linkedin: ""

highlighter: rouge
permalink: /:year/:month/:day/:title

plugins:
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/james-headshot-lg.jpg

exclude:
  - docs
  - test
  - tmp
  - src
  - node_modules
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - README.md
  - LICENSE.md
  - netlify.toml
  - renovate.json
  - mise.toml
