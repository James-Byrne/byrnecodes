title: Byrnecodes
description: "James Byrne is a freelance full-stack developer in Ireland: Ember and Rails web apps, iPhone and Apple Watch apps, and payment systems."
url: https://byrnecodes.com
locale: en_IE
author: James Byrne
email: james@byrnecodes.com
availability: ""
social:
  name: James Byrne
  github: james-byrne
  linkedin: https://www.linkedin.com/in/jamesdesbyrne/
  links:
    - https://github.com/james-byrne
    - https://www.linkedin.com/in/jamesdesbyrne/

highlighter: rouge
permalink: /:year/:month/:day/:title

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/james-headshot-lg.jpg

exclude:
  - docs
  - test
  - tmp
  - src
  - node_modules
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - README.md
  - LICENSE.md
  - netlify.toml
  - renovate.json
  - mise.toml
